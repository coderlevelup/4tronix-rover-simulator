<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Status</title>
    <link rel="stylesheet" href="/static/yard-base.css">
    <style>
        body { min-height: 100vh; background: var(--background); color: var(--foreground); }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: var(--heading);
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-faint);
            margin-bottom: 2rem;
        }

        .cards {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            max-width: 720px;
            margin-top: 1.4rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.1rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 1.1rem;
            transition: border-color 0.16s, background 0.16s;
        }
        .card:hover { border-color: var(--border-strong); background: var(--surface-2); }

        .badge {
            flex-shrink: 0;
            width: 46px;
            height: 46px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            color: var(--text-faint);
        }
        .badge svg { width: 24px; height: 24px; }
        .badge.green { background: rgba(52, 211, 153, 0.12);  color: var(--ok);   border-color: rgba(52, 211, 153, 0.3); }
        .badge.amber { background: rgba(251, 191, 36, 0.12);  color: var(--warn); border-color: rgba(251, 191, 36, 0.3); }
        .badge.red   { background: rgba(248, 113, 113, 0.12); color: var(--bad);  border-color: rgba(248, 113, 113, 0.3); }
        .badge.grey  { background: var(--surface-3);          color: var(--text-faint); border-color: var(--border); }

        .card-body { flex: 1; min-width: 0; }

        .card-title { font-size: 1rem; font-weight: 650; color: var(--heading); margin-bottom: 0.3rem; }

        .card-detail { font-size: 0.8rem; color: var(--text-dim); line-height: 1.55; font-family: var(--mono); }
        .card-detail span { color: var(--text); }

        .status-label {
            display: inline-block;
            margin-top: 0.55rem;
            font-size: 0.64rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            padding: 0.28rem 0.6rem;
            border-radius: 999px;
            border: 1px solid var(--border);
        }
        .status-label.green { color: var(--ok);   background: rgba(52, 211, 153, 0.1);  border-color: rgba(52, 211, 153, 0.35); }
        .status-label.amber { color: var(--warn); background: rgba(251, 191, 36, 0.1);  border-color: rgba(251, 191, 36, 0.35); }
        .status-label.red   { color: var(--bad);  background: rgba(248, 113, 113, 0.1); border-color: rgba(248, 113, 113, 0.35); }
        .status-label.grey  { color: var(--text-faint); background: var(--surface-3); border-color: var(--border); }

        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--text-faint);
        }

        .subtitle code { color: var(--text); }

        .link-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 0.85rem;
            cursor: pointer;
            padding: 0 0.25rem;
        }

        .link-btn:hover { text-decoration: underline; }

        .url-editor {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: -1.25rem 0 2rem;
            max-width: 640px;
        }

        /* the hidden attribute must beat the display:flex above */
        .url-editor[hidden] { display: none; }

        .url-editor input {
            flex: 1;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.9rem;
            padding: 0.45rem 0.6rem;
        }

        .editor-btn {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-dim);
            font-size: 0.85rem;
            padding: 0.45rem 0.9rem;
            cursor: pointer;
        }

        .editor-btn.save {
            border-color: var(--ok);
            color: var(--ok);
        }

        .editor-btn:hover { background: var(--surface); }

        .url-error {
            color: var(--bad);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    {% set nav_active = 'status' %}{% include "_nav.html" %}

    <main class="page">
    <p class="eyebrow">Diagnostics</p>
    <h1 class="page-title" style="margin-bottom: 0.4rem;">System Status</h1>
    <p class="subtitle">
        Rover URL: <code id="rover-url">{{ rover_url }}</code>
        <button class="link-btn" id="edit-url-btn">edit</button>
    </p>
    <div class="url-editor" id="url-editor" hidden>
        <input type="text" id="url-input" spellcheck="false"
               placeholder="http://curiosity.local:8523">
        <button class="editor-btn save" id="save-url-btn">Save</button>
        <button class="editor-btn" id="cancel-url-btn">Cancel</button>
        <span class="url-error" id="url-error"></span>
    </div>

    <div class="cards" id="cards">
        <!-- Satellite -->
        <div class="card" id="card-satellite">
            <div class="badge grey" id="badge-satellite">?</div>
            <div class="card-body">
                <div class="card-title">Satellite</div>
                <div class="card-detail" id="detail-satellite">Loading&hellip;</div>
                <div class="status-label grey" id="label-satellite">checking</div>
            </div>
        </div>

        <!-- Rover -->
        <div class="card" id="card-rover">
            <div class="badge grey" id="badge-rover">?</div>
            <div class="card-body">
                <div class="card-title">Rover</div>
                <div class="card-detail" id="detail-rover">Loading&hellip;</div>
                <div class="status-label grey" id="label-rover">checking</div>
            </div>
        </div>

        <!-- Camera -->
        <div class="card" id="card-camera">
            <div class="badge grey" id="badge-camera">?</div>
            <div class="card-body">
                <div class="card-title">Camera</div>
                <div class="card-detail" id="detail-camera">Loading&hellip;</div>
                <div class="status-label grey" id="label-camera">checking</div>
            </div>
        </div>
    </div>

    <div class="footer" id="footer">Checking&hellip;</div>
    </main>

    <script>
        const BADGE_ICONS = {
            green: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
            amber: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
            red: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
            grey: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>',
        };

        function setBadge(id, state) {
            const el = document.getElementById('badge-' + id);
            const lbl = document.getElementById('label-' + id);
            el.className = 'badge ' + state.colour;
            el.innerHTML = BADGE_ICONS[state.colour] || '';
            lbl.className = 'status-label ' + state.colour;
            lbl.textContent = state.text;
        }

        function setDetail(id, html) {
            document.getElementById('detail-' + id).innerHTML = html;
        }

        function row(label, value) {
            return label + ': <span>' + (value ?? '—') + '</span>  ';
        }

        // Mast camera line for the rover card (the rover's own camera, used by
        // the Take a Picture block — distinct from the satellite stream below)
        function roverCam(r) {
            const cam = r.camera;
            if (!cam) return '';
            return cam.detected
                ? '<br>Mast cam: <span style="color:var(--ok)">' + (cam.model || 'detected') + '</span>'
                : '<br>Mast cam: <span style="color:var(--bad)">not detected (reseat + reboot)</span>';
        }

        // Pure render step, split out from the fetch so a cached snapshot
        // (read on load, see below) can paint instantly through the exact
        // same path a live poll uses — no separate "cached" rendering to
        // keep in sync.
        function renderStatus(data) {
            // Satellite — always green if this page loaded
            setBadge('satellite', { colour: 'green', text: 'OK' });
            setDetail('satellite',
                row('Hostname', data.satellite.hostname) +
                row('IP', data.satellite.ip)
            );

            // Keep the displayed rover URL in sync with the server
            document.getElementById('rover-url').textContent = data.rover.url;

            // Rover
            const r = data.rover;
            if (!r.reachable) {
                setBadge('rover', { colour: 'red', text: 'Unreachable' });
                setDetail('rover', row('URL', r.url));
            } else if (r.status && r.status !== 'ok') {
                // Reachable but the queue processor thread is dead:
                // commands would be accepted yet never executed
                setBadge('rover', { colour: 'red', text: 'Processor stalled' });
                setDetail('rover',
                    row('Driver', r.driver) +
                    row('Queue', r.queue_size) +
                    roverCam(r)
                );
            } else {
                if (r.hardware === false) {
                    setBadge('rover', { colour: 'amber', text: 'Fake driver (no hardware)' });
                } else {
                    setBadge('rover', { colour: 'green', text: 'OK' });
                }
                setDetail('rover',
                    row('Driver', r.driver) +
                    row('Queue', r.queue_size) +
                    roverCam(r)
                );
            }

            // Camera
            const c = data.camera;
            if (c.reachable) {
                setBadge('camera', { colour: 'green', text: 'OK' });
                setDetail('camera', row('Port', c.port));
            } else {
                setBadge('camera', { colour: 'red', text: 'Port closed' });
                setDetail('camera', row('Port', c.port) + '(service not running?)');
            }
        }

        // Instant paint from the last snapshot this tab saw, so the cards
        // don't sit on "Loading…" every time this page is opened.
        const cachedStatus = YardCache.read('fullStatus');
        if (cachedStatus) {
            renderStatus(cachedStatus.value);
            const age = Math.round((Date.now() - cachedStatus.ts) / 1000);
            document.getElementById('footer').textContent = 'Showing cached status (' + age + 's old) — refreshing…';
        }

        let consecutiveFailures = 0;

        const statusPoller = YardCache.createPoller({
            interval: 5000,
            maxInterval: 20000,
            fetchFn: function () {
                return fetch('/api/status').then(r => r.json()).then(data => {
                    consecutiveFailures = 0;
                    YardCache.write('fullStatus', data);
                    renderStatus(data);
                    const now = new Date().toLocaleTimeString();
                    document.getElementById('footer').textContent = 'Last checked: ' + now;
                });
            },
            onError: function () {
                // Exponential backoff (handled by the poller) means retries
                // space out on their own; surface that instead of implying
                // we're hammering the satellite every 5s regardless.
                consecutiveFailures++;
                document.getElementById('footer').textContent = consecutiveFailures > 1
                    ? 'Fetch failed (' + consecutiveFailures + ' in a row) — backing off, retrying…'
                    : 'Fetch failed — retrying…';
            }
        });

        // Rover URL editor
        const urlEditor = document.getElementById('url-editor');
        const urlInput = document.getElementById('url-input');
        const urlError = document.getElementById('url-error');

        document.getElementById('edit-url-btn').addEventListener('click', () => {
            urlInput.value = document.getElementById('rover-url').textContent;
            urlError.textContent = '';
            urlEditor.hidden = false;
            urlInput.focus();
        });

        document.getElementById('cancel-url-btn').addEventListener('click', () => {
            urlEditor.hidden = true;
        });

        async function saveUrl() {
            urlError.textContent = '';
            try {
                const resp = await fetch('/api/config/rover_url', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput.value }),
                });
                const data = await resp.json();
                if (!resp.ok) {
                    urlError.textContent = data.error || 'Save failed';
                    return;
                }
                document.getElementById('rover-url').textContent = data.rover_url;
                if (data.persisted) {
                    urlEditor.hidden = true;
                } else {
                    urlError.textContent = 'Applied, but could not write config file — will reset on restart';
                }
                statusPoller.refreshNow().catch(() => {}); // jump the backoff queue after a config change instead of waiting out any backoff delay; failure is already surfaced via the footer banner
            } catch (e) {
                urlError.textContent = 'Save failed: ' + e.message;
            }
        }

        document.getElementById('save-url-btn').addEventListener('click', saveUrl);
        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') saveUrl();
            if (e.key === 'Escape') urlEditor.hidden = true;
        });
    </script>
</body>
</html>
