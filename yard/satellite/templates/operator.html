<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Console</title>
    <link rel="stylesheet" href="/static/yard-base.css">
    <style>
        body { min-height: 100vh; }

        .wrap { max-width: 920px; margin: 0 auto; padding: 1.9rem 1.5rem 3rem; }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.25rem;
        }

        h1 { font-size: 1.5rem; font-weight: 600; color: #fff; }
        .subtitle { font-size: 0.85rem; color: #666; }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.3rem 0.75rem;
            border: 1px solid #333;
            color: #888;
        }
        .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
        .badge.online  { border-color: #22c55e; color: #4ade80; }
        .badge.online .dot { background: #22c55e; }
        .badge.offline { border-color: #ef4444; color: #f87171; }
        .badge.offline .dot { background: #ef4444; }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 0.45rem 0.7rem;
            margin-bottom: 1rem;
            max-width: 360px;
        }
        .search-box svg { width: 16px; height: 16px; color: #666; flex-shrink: 0; }
        .search-box input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #e0e0e0;
            font-size: 0.85rem;
        }
        .search-box input::placeholder { color: #555; }
        .search-box .clear-search {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0 0.2rem;
            display: none;
        }
        .search-box .clear-search.visible { display: block; }
        .search-box .clear-search:hover { color: #ccc; }

        .toolbar { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
        .toolbar a, .toolbar button {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #ccc;
            font-size: 0.8rem;
            padding: 0.45rem 0.8rem;
            text-decoration: none;
            cursor: pointer;
        }
        .toolbar a:hover, .toolbar button:hover { border-color: #555; }

        .stages {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 0.6rem;
            margin-bottom: 1.25rem;
        }
        .stage {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 0.6rem 0.9rem;
            cursor: pointer;
        }
        .stage.active { border-color: #f97316; }
        .stage .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: #888; }
        .stage .count { font-size: 1.4rem; font-weight: 700; color: #fff; }

        .mission {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            margin-bottom: 0.9rem;
            overflow: hidden;
        }

        .mission-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.8rem 1rem;
            border-bottom: 1px solid #242424;
            flex-wrap: wrap;
        }
        .mission-title { font-size: 0.95rem; font-weight: 600; color: #fff; }
        .mission-meta { font-size: 0.75rem; color: #666; font-family: ui-monospace, monospace; }

        .pill {
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.2rem 0.6rem;
            border: 1px solid;
        }
        .pill.queued     { color: #60a5fa; border-color: #1d4ed8; background: #172554; }
        .pill.processing { color: #fbbf24; border-color: #b45309; background: #451a03; }
        .pill.completed  { color: #4ade80; border-color: #15803d; background: #14532d; }
        .pill.failed     { color: #f87171; border-color: #b91c1c; background: #450a0a; }

        pre {
            background: #111;
            color: #d0d0d0;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.78rem;
            line-height: 1.5;
            padding: 0.9rem 1rem;
            max-height: 180px;
            overflow: auto;
        }

        .mission-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            padding: 0.75rem 1rem;
            border-top: 1px solid #242424;
        }

        .btn {
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            background: #222;
            color: #ccc;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.5rem 0.9rem;
            cursor: pointer;
        }
        .btn:hover { border-color: #555; }
        .btn:disabled { opacity: 0.5; cursor: default; }
        .btn.primary { background: #f97316; border-color: #f97316; color: #fff; }
        .btn.primary:hover { background: #ea580c; }
        .btn.success { background: #14532d; border-color: #15803d; color: #4ade80; }

        .mission-actions input {
            flex: 1;
            min-width: 200px;
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 0.8rem;
            padding: 0.5rem 0.75rem;
            outline: none;
        }
        .mission-actions input:focus { border-color: #f97316; }

        .action-error { width: 100%; color: #f87171; font-size: 0.78rem; }
        .yt-link { color: #4ade80; font-size: 0.8rem; text-decoration: none; }
        .yt-link:hover { text-decoration: underline; }

        .empty {
            text-align: center;
            color: #666;
            padding: 3rem 1rem;
            border: 1px dashed #2a2a2a;
            border-radius: 12px;
        }

        /* Stale/offline banner — reuses the pill colour language already
           used for mission status (amber/red) instead of introducing new
           tokens */
        .net-banner {
            display: none;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.78rem;
            border-radius: 8px;
            padding: 0.55rem 0.85rem;
            margin-bottom: 0.9rem;
        }
        .net-banner.visible { display: flex; }
        .net-banner.stale { color: #fbbf24; background: #451a03; border: 1px solid #b45309; }
        .net-banner.offline { color: #f87171; background: #450a0a; border: 1px solid #b91c1c; }
        .net-banner.syncing { color: #60a5fa; background: #172554; border: 1px solid #1d4ed8; }

        .sync-status { font-size: 0.72rem; color: #555; margin: -0.55rem 0 0.9rem; }
    </style>
</head>
<body>
    {% set nav_active = 'queue' %}{% include "_nav.html" %}
    <div class="wrap">
        <div style="margin-bottom: 1.5rem;">
            <p class="eyebrow">Mission Queue</p>
            <h1 class="page-title">Operator Console</h1>
        </div>

        <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="Search missions by name or yard ID&hellip;" autocomplete="off">
            <button class="clear-search" id="clearSearch" title="Clear search">&times;</button>
        </div>

        <div class="net-banner" id="netBanner"></div>
        <div class="sync-status" id="syncStatus"></div>
        <div class="stages" id="stages"></div>
        <div id="missions"></div>
    </div>

    <script>
        const STAGES = [
            { key: 'all',        label: 'All' },
            { key: 'queued',     label: 'Queued' },
            { key: 'processing', label: 'Running' },
            { key: 'completed',  label: 'Done' },
        ];
        let stage = 'queued';
        let missions = [];
        let missionsJson = null;   // last-rendered snapshot, for change detection below
        let hasLoadedOnce = false; // true once we've had a real (cached or fetched) list to show
        let searchQuery = '';
        // Draft YouTube URLs survive re-renders so a half-typed link is not
        // wiped by the 15s refresh.
        const drafts = {};

        const stagesEl = document.getElementById('stages');
        const missionsEl = document.getElementById('missions');
        const netBanner = document.getElementById('netBanner');

        function setBanner(kind, text) {
            if (!kind) { netBanner.className = 'net-banner'; return; }
            netBanner.className = 'net-banner visible ' + kind;
            netBanner.textContent = text;
        }

        function matchesSearch(m) {
            if (!searchQuery) return true;
            const haystack = `${m.name || ''} ${m.yardId || ''}`.toLowerCase();
            return haystack.includes(searchQuery);
        }

        function count(key) {
            const pool = missions.filter(matchesSearch);
            if (key === 'all') return pool.length;
            return pool.filter(m => m.status === key).length;
        }

        function relTime(iso) {
            if (!iso) return '';
            const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
            if (mins < 1) return 'just now';
            if (mins < 60) return mins + 'm ago';
            const hrs = Math.round(mins / 60);
            if (hrs < 24) return hrs + 'h ago';
            return Math.round(hrs / 24) + 'd ago';
        }

        function renderStages() {
            stagesEl.innerHTML = STAGES.map(s => `
                <div class="stage ${stage === s.key ? 'active' : ''}" data-stage="${s.key}">
                    <div class="label">${s.label}</div>
                    <div class="count">${count(s.key)}</div>
                </div>`).join('');
            stagesEl.querySelectorAll('.stage').forEach(el => {
                el.onclick = () => { stage = el.dataset.stage; render(); };
            });
        }

        function esc(s) {
            return (s || '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }

        function actionsFor(m) {
            if (m.status === 'queued') {
                return `<button class="btn primary" data-act="send" data-id="${m.id}">Send to rover</button>
                        <button class="btn" data-act="copy" data-id="${m.id}">Copy code</button>
                        <button class="btn" data-act="complete" data-id="${m.id}">Mark complete</button>`;
            }
            if (m.status === 'processing') {
                return `<button class="btn success" data-act="complete" data-id="${m.id}">Mark complete</button>
                        <button class="btn" data-act="copy" data-id="${m.id}">Copy code</button>${m.blocklyState ? `<button class="btn" data-act="copyblocks" data-id="${m.id}">Copy blocks</button>` : ''}`;
            }
            if (m.status === 'completed' && !m.youtubeUrl) {
                return `<input type="url" placeholder="https://youtube.com/watch?v=..." value="${esc(drafts[m.id] || '')}" data-draft="${m.id}">
                        <button class="btn primary" data-act="youtube" data-id="${m.id}">Attach video</button>
                        <button class="btn" data-act="rerun" data-id="${m.id}">Rerun</button>`;
            }
            if (m.status === 'completed') {
                return `<a class="yt-link" href="${esc(m.youtubeUrl)}" target="_blank" rel="noopener">Video attached &#8599;</a>
                        <button class="btn" data-act="rerun" data-id="${m.id}">Rerun</button>`;
            }
            if (m.status === 'failed') {
                return `<button class="btn primary" data-act="rerun" data-id="${m.id}">Rerun</button>
                        <button class="btn" data-act="copy" data-id="${m.id}">Copy code</button>${m.blocklyState ? `<button class="btn" data-act="copyblocks" data-id="${m.id}">Copy blocks</button>` : ''}`;
            }
            return '';
        }

        function render() {
            renderStages();
            const visible = missions
                .filter(m => stage === 'all' || m.status === stage)
                .filter(matchesSearch);
            if (visible.length === 0) {
                missionsEl.innerHTML = !hasLoadedOnce
                    ? '<div class="empty">Loading missions&hellip;</div>'
                    : searchQuery
                        ? `<div class="empty">No missions match "${esc(searchQuery)}".</div>`
                        : '<div class="empty">Nothing here. New submissions land automatically.</div>';
                return;
            }
            missionsEl.innerHTML = visible.map(m => `
                <div class="mission">
                    <div class="mission-head">
                        <div>
                            <div class="mission-title">${esc(m.name) || 'Mission-' + m.id.slice(0, 8)}</div>
                            <div class="mission-meta">${esc(m.yardId) || ''} &middot; ${relTime(m.submittedAt)}</div>
                        </div>
                        <span class="pill ${m.status}">${m.status === 'processing' ? 'running' : esc(m.status)}</span>
                    </div>
                    <pre>${esc((m.code || '').trim()) || '# No code'}</pre>
                    <div class="mission-actions" data-mission="${m.id}">${actionsFor(m)}</div>
                </div>`).join('');

            missionsEl.querySelectorAll('input[data-draft]').forEach(el => {
                el.oninput = () => { drafts[el.dataset.draft] = el.value; };
            });
            missionsEl.querySelectorAll('button[data-act]').forEach(el => {
                el.onclick = () => act(el.dataset.act, el.dataset.id, el);
            });
        }

        function showError(missionId, message) {
            const row = missionsEl.querySelector(`.mission-actions[data-mission="${missionId}"]`);
            if (!row) return;
            let err = row.querySelector('.action-error');
            if (!err) {
                err = document.createElement('div');
                err.className = 'action-error';
                row.appendChild(err);
            }
            err.textContent = message;
        }

        async function act(action, missionId, btn) {
            if (action === 'copy' || action === 'copyblocks') {
                const m = missions.find(x => x.id === missionId);
                const text = action === 'copyblocks' ? (m.blocklyState || '') : (m.code || '');
                const label = btn.textContent;
                try {
                    await navigator.clipboard.writeText(text);
                    btn.textContent = 'Copied';
                    setTimeout(() => { btn.textContent = label; }, 1500);
                } catch {
                    showError(missionId, 'Could not copy to clipboard');
                }
                return;
            }

            const endpoints = { send: 'send', complete: 'complete', youtube: 'youtube', rerun: 'rerun' };
            let body;
            if (action === 'youtube') body = { url: drafts[missionId] || '' };

            btn.disabled = true;
            try {
                const resp = await fetch(`/operator/api/missions/${missionId}/${endpoints[action]}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: body ? JSON.stringify(body) : undefined,
                });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) throw new Error(data.error || `Failed (HTTP ${resp.status})`);
                delete drafts[missionId];
                await load();
            } catch (err) {
                btn.disabled = false;
                showError(missionId, err.message);
            }
        }

        // Applies a freshly-fetched (or cached) mission list. Skips the
        // (relatively expensive) full DOM rebuild when the data is byte-
        // identical to what's already on screen — the 15s poll fires
        // constantly, and without this an operator mid-typing a YouTube
        // URL would have their input torn down and re-focus lost on every
        // tick even though nothing actually changed server-side.
        function applyMissions(list) {
            const json = JSON.stringify(list);
            missions = list;
            hasLoadedOnce = true;
            if (json === missionsJson) return false;
            missionsJson = json;
            render();
            return true;
        }

        let consecutiveFailures = 0;
        let lastSyncedAt = null; // epoch ms of the last confirmed-fresh mission data (fetch or cache load)

        const syncStatusEl = document.getElementById('syncStatus');

        function formatAge(ms) {
            const s = Math.round((Date.now() - ms) / 1000);
            if (s < 5) return 'just now';
            if (s < 60) return `${s}s ago`;
            const m = Math.round(s / 60);
            if (m < 60) return `${m}m ago`;
            return `${Math.round(m / 60)}h ago`;
        }

        // "Last synced: …" is always visible once we have any timestamp,
        // independent of the net-banner (which only appears for stale/
        // offline/syncing states) — so the operator always has a concrete
        // answer to "how current is this?"
        function updateSyncStatus() {
            syncStatusEl.textContent = lastSyncedAt ? `Last synced: ${formatAge(lastSyncedAt)}` : '';
        }
        setInterval(updateSyncStatus, 5000);

        function markSynced(ts) {
            lastSyncedAt = ts;
            updateSyncStatus();
        }

        // Instant paint from whatever this tab last saw, before the network
        // round-trip completes, so the console doesn't sit on "Loading…"
        // every time an operator switches back to this tab/page.
        const cachedMissions = YardCache.read('missions');
        if (cachedMissions) {
            applyMissions(cachedMissions.value);
            markSynced(cachedMissions.ts);
            setBanner('stale', `Showing missions from ${Math.round((Date.now() - cachedMissions.ts) / 1000)}s ago — refreshing…`);
        } else {
            // No in-tab cache — e.g. the browser was fully closed and
            // reopened, so sessionStorage is empty. Fall back to the
            // persistent IndexedDB tier so missions from the last session
            // still appear instantly instead of a blank "Loading…" screen.
            // Guarded on !hasLoadedOnce so a network response that lands
            // first (fast connection) isn't clobbered by this slower path.
            YardCache.readPersistent('missions').then(function (persisted) {
                if (persisted && !hasLoadedOnce) {
                    applyMissions(persisted.value);
                    markSynced(persisted.ts);
                    setBanner('stale', `Showing missions from ${Math.round((Date.now() - persisted.ts) / 1000)}s ago — refreshing…`);
                }
            });
        }

        const missionsPoller = YardCache.createPoller({
            interval: 15000,
            maxInterval: 60000,
            fetchFn: async function () {
                const resp = await fetch('/operator/api/missions');
                if (resp.status === 401) { window.location.href = '/operator/login'; return; }
                const data = await resp.json();
                const list = data.missions || [];
                consecutiveFailures = 0;
                YardCache.write('missions', list); // mirrors into sessionStorage + IndexedDB
                applyMissions(list);
                markSynced(Date.now());
                setBanner(null); // back online — clear any stale/offline/syncing banner
            },
            onOnline: function () {
                // Immediate feedback the instant the browser reports we're
                // back, rather than waiting for the resync fetch to resolve.
                setBanner('syncing', 'Syncing latest missions…');
            },
            onOffline: function () {
                setBanner('offline', hasLoadedOnce
                    ? 'Offline – displaying cached missions'
                    : 'Offline – waiting for connection…');
            },
            onError: function () {
                consecutiveFailures++;
                if (hasLoadedOnce) {
                    // We still have real data on screen (fresh or cached) — stay
                    // read-only rather than blocking the operator's view.
                    setBanner('offline', consecutiveFailures > 1
                        ? `Offline – displaying cached missions (retry ${consecutiveFailures})`
                        : 'Offline – displaying cached missions');
                } else {
                    // Genuinely nothing to show yet (no cache, first load failed)
                    setBanner('offline', "Can't reach the server — retrying…");
                    render(); // repaint the "Loading…" empty-state note if still blank
                }
            }
        });

        // Reflect an already-offline browser (e.g. opened in airplane mode)
        // immediately, instead of waiting for the first fetch to time out.
        if (!navigator.onLine) {
            setBanner('offline', hasLoadedOnce
                ? 'Offline – displaying cached missions'
                : 'Offline – waiting for connection…');
        }

        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearch');

        searchInput.addEventListener('input', () => {
            searchQuery = searchInput.value.trim().toLowerCase();
            clearSearchBtn.classList.toggle('visible', searchQuery.length > 0);
            render();
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            clearSearchBtn.classList.remove('visible');
            render();
            searchInput.focus();
        });
    </script>
</body>
</html>
